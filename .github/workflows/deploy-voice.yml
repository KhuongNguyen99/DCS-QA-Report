name: Deploy voice comments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-voice-comments
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: QA-Report
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Sync server secret and deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$ELEVENLABS_API_KEY" ]]; then
            echo "Add SUPABASE_ACCESS_TOKEN and ELEVEN_LABS_API_KEY to the QA-Report GitHub environment."
            exit 1
          fi
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          if [[ "$ELEVENLABS_API_KEY" == *$'\n'* || "$ELEVENLABS_API_KEY" == *$'\r'* ]]; then
            echo "The ElevenLabs key must be a single line."
            exit 1
          fi
          printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" > "$secret_file"
          supabase secrets set --project-ref ybeinufetluekswsulvj --env-file "$secret_file"
          supabase functions deploy transcribe-comment --project-ref ybeinufetluekswsulvj --use-api
