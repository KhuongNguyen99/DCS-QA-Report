name: Diagnose voice service

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: QA-Report
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check provider with synthetic audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: deno run --allow-env=ELEVENLABS_API_KEY --allow-net=api.elevenlabs.io --allow-read=tests/fixtures/voice-check.wav scripts/diagnose-voice.mjs
